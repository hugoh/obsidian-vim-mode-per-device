---
# Obsidian reads the plugin version from manifest.json on the default branch and
# needs an unprefixed tag equal to it, so release-please (not the fleet's tag-only
# cog-bump) keeps a release PR that bumps manifest.json/package.json. Merging it
# tags X.Y.Z and opens a draft release; `publish` attaches the build and only then
# un-drafts it, so Obsidian never sees a version without assets.
name: release

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # An app token, not GITHUB_TOKEN, so the release PR triggers the required CI checks.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: hugoh/gh-workflows/setup@fc872ebc6ac6bb28fa73a2e83f9f354faad9b5b7 # v1.40.6

      - name: Build
        run: |
          bun install --frozen-lockfile
          bun test
          bun run lint
          bun run build

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: main.js

      - name: Upload assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" main.js manifest.json
          gh release edit "$TAG" --draft=false --latest
